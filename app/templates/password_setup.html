{% extends "base.html" %}
{% block title %}Set Your Password · CampusHub{% endblock %}

{% block content %}
<section class="card">
  <p class="eyebrow">CAMPUSHUB ACCOUNT SECURITY</p>
  <h1>Set your password</h1>
  <p class="muted">Choose a password to activate access to your student account.</p>

  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>New password
      <input type="password" name="password" minlength="12"
             autocomplete="new-password" required>
    </label>

    <label>Confirm password
      <input type="password" name="confirm_password" minlength="12"
             autocomplete="new-password" required>
    </label>

    <button class="button" type="submit">Set password</button>
  </form>
  <p class="muted">Links expire after one hour. Never share your setup link.</p>
</section>
{% endblock %}
